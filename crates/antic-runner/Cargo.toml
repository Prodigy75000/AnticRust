[package]
name = "antic-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Dev harnesses for AnticRust: test-ROM runs, headless renders, and HLE-versus-real-BIOS differential runs."

[[bin]]
name = "antic"
path = "src/antic.rs"

[dependencies]
antic-core = { path = "../antic-core" }
# tomharte harness only: parse the SingleStepTests JSON (optionally gzipped).
# Dev-tool deps; the core and the shipped libretro cdylib pull in neither.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

# CPU conformance: TomHarte single-step vectors (NMOS 6502, decimal on).
[[bin]]
name = "tomharte"
path = "src/tomharte.rs"

# CPU conformance: Klaus Dormann's functional test, decimal tests included.
[[bin]]
name = "klaus"
path = "src/klaus.rs"

# Disassemble part of an image: ask what the CPU is executing.
[[bin]]
name = "dis"
path = "src/dis.rs"

# Boot a cartridge on the real BIOS and report what it is executing.
[[bin]]
name = "boot"
path = "src/boot.rs"

# BIOS census: what each cartridge uses of the real BIOS. The instrument the
# HLE is designed from, and, re-run in HLE mode, its diff harness.
[[bin]]
name = "census"
path = "src/census.rs"
